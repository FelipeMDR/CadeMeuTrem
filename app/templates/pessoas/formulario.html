{% extends "base.html" %}
{% import "_campos.html" as campos %}
{% block conteudo %}
<form class="formulario" id="formulario" method="post">
    {{ campos.identificador(id_) }}
    <div class="campo">
        <label for="nome">Nome *</label>
        <input type="text" id="nome" name="nome" maxlength="{{ nome_max }}" value="{{ dados.nome }}">
    </div>
    <div class="campo">
        <label for="contato">Contato</label>
        <input type="text" id="contato" name="contato" maxlength="{{ contato_max }}" value="{{ dados.contato }}">
        <small>Telefone, e-mail ou outra forma de contato.</small>
    </div>
    {{ campos.sim_nao('ativo', 'Ativo *', dados.ativo) }}
    <p class="obrigatorios">Campos com * são obrigatórios.</p>
    <button type="submit" id="salvar">Salvar</button>
    <a class="botao secundario" id="cancelar" href="{{ url_for('pessoas.consultar') }}">Cancelar</a>
</form>
{% endblock %}
